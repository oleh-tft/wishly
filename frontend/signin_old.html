<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCRUM-23</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <main class="page-wrapper">

    <!-- Top navigation -->
    <nav class="topbar" aria-label="Верхня навігація">
      <a href="/" class="logo" aria-label="Wishly — на головну">wishly</a>
      <div class="topbar-right">
        <button class="lang-btn" aria-label="Змінити мову">
          EN <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <a href="/" class="back-link" aria-label="Назад">← Back</a>
      </div>
    </nav>


    <!-- Left headline -->
    <section class="left-content">
      <h1 class="headline">Sign in to <span class="brand">Wishly</span></h1>
      <p class="subline">Already have an account?&nbsp; <a href="/login">Log in</a></p>
    </section>

    <!-- Right form -->
    <section class="right-panel">
      <div class="form-card">
        <form action="#" method="post" novalidate>

          <!-- Email -->
          <div class="input-group input-email">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3" />
                <polyline points="2,4 12,13 22,4" />
              </svg>
            </span>
            <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email"
              aria-label="Електронна пошта" required>
          </div>

          <!-- Password -->
          <div class="input-group input-password">
            <input type="password" id="password" name="password" placeholder="••••••••••••"
              autocomplete="current-password" aria-label="Пароль" required>
            <button type="button" class="toggle-password" aria-label="Показати/приховати пароль"
              onclick="togglePassword(this)">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>

          <!-- Remember me -->
          <div class="remember-row">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>

          <!-- Sign in button -->
          <button type="submit" class="btn-signin">
            Sign in <span class="arrow" aria-hidden="true">→</span>
          </button>

          <!-- Divider -->
          <div class="divider" role="separator" aria-label="або">or</div>

          <!-- Google -->
          <button type="button" class="btn-social btn-google" aria-label="Увійти через Google">
            <span class="icon-google" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4" />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853" />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                  fill="#FBBC05" />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335" />
              </svg>
            </span>
            Sign in with Google
          </button>

          <!-- Apple -->
          <button type="button" class="btn-social btn-apple" aria-label="Увійти через Apple">
            <span class="icon-apple" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.14-2.19 1.28-2.17 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.77M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
              </svg>
            </span>
            Sign in with Apple
          </button>

        </form>
      </div>
    </section>

  </main>
  <script>
    function togglePassword(button) {
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        // Можна додати зміну іконки ока на перекреслене око за бажанням
      } else {
        passwordInput.type = 'password';
      }
    }
  </script>
</body>

</html>
